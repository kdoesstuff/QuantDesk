<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0e1117" />
    <title>Quant Desk</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e1117'/%3E%3Ccircle cx='11' cy='11' r='3.2' fill='%23faed26'/%3E%3Ccircle cx='21' cy='21' r='3.2' fill='%23faed26'/%3E%3Ccircle cx='21' cy='11' r='3.2' fill='%232b4dff'/%3E%3Ccircle cx='11' cy='21' r='3.2' fill='%232b4dff'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint. "ink" is the default.
      try {
        var t = localStorage.getItem('qd.theme');
        var ok = ['ink', 'eggshell', 'periwinkle', 'blush', 'charcoal', 'plum', 'sky'];
        document.documentElement.dataset.theme = ok.indexOf(t) >= 0 ? t : 'ink';
      } catch (e) {
        document.documentElement.dataset.theme = 'ink';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
